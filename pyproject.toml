[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttm-model-foundry"
version = "0.0.1"
description = "Agentic foundry that co-evolves a scientific theory with a computational model, predictions, and experimental designs."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "analyzers*",
    "primitives*",
    "src*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
